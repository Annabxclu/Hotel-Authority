<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Authority</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: fixed ink sidebar + scrolling operations canvas; brass marks money and primary actions */
  --ink:#15232c; --ink-2:#203540; --ink-text:#c3d0d5; --ink-muted:#7f949c;
  --bg:#edf0ef; --surface:#ffffff; --surface-2:#f5f7f6; --line:#d9e0dd; --line-2:#e8ecea;
  --text:#16232a; --muted:#5a686e;
  --brass:#9c6b17; --brass-strong:#7f560f; --brass-soft:#f3e7cf; --on-brass:#ffffff;
  --good:#1f7549; --good-soft:#e0f1e7; --warn:#9a5c0c; --warn-soft:#fbecd6;
  --bad:#ad322b; --bad-soft:#f8e0dd; --info:#285f87; --info-soft:#dfedf6; --idle:#5f6f75; --idle-soft:#e7ecec;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0d161b; --ink-2:#1a2a32; --ink-text:#c3d0d5; --ink-muted:#7a8f97;
    --bg:#121b20; --surface:#19252b; --surface-2:#1f2d34; --line:#2c3d45; --line-2:#24343b;
    --text:#e4ebee; --muted:#97a8af;
    --brass:#d9a54a; --brass-strong:#e8b862; --brass-soft:#3a2f1c; --on-brass:#1b1408;
    --good:#5cc48d; --good-soft:#173628; --warn:#e5a54e; --warn-soft:#3b2c16;
    --bad:#ef7b72; --bad-soft:#3e1f1d; --info:#71b3e0; --info-soft:#17303f; --idle:#9aaab0; --idle-soft:#26343a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#0d161b; --ink-2:#1a2a32; --ink-text:#c3d0d5; --ink-muted:#7a8f97;
  --bg:#121b20; --surface:#19252b; --surface-2:#1f2d34; --line:#2c3d45; --line-2:#24343b;
  --text:#e4ebee; --muted:#97a8af;
  --brass:#d9a54a; --brass-strong:#e8b862; --brass-soft:#3a2f1c; --on-brass:#1b1408;
  --good:#5cc48d; --good-soft:#173628; --warn:#e5a54e; --warn-soft:#3b2c16;
  --bad:#ef7b72; --bad-soft:#3e1f1d; --info:#71b3e0; --info-soft:#17303f; --idle:#9aaab0; --idle-soft:#26343a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
a{color:var(--info)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hide{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--ink);color:var(--ink-text);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--ink-2)}
.brand b{display:block;font-family:var(--display);font-size:19px;color:#fff;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-muted)}
.nav{overflow-y:auto;padding:8px 8px 16px;flex:1}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;color:var(--ink-text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a.on{background:var(--ink-2);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav .n{font-family:var(--mono);font-size:11px;color:var(--ink-muted);width:18px}
.nav .lbl{flex:1}
.nav .ct{font-size:11px;background:var(--brass);color:var(--on-brass);border-radius:9px;padding:0 7px;font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .hname{font-family:var(--display);font-weight:700;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0}
.top .hname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;white-space:nowrap}
.speed{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.speed button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.speed button+button{border-left:1px solid var(--line)}
.speed button.on{background:var(--ink);color:#fff}
.bal{font-weight:600;white-space:nowrap}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;cursor:pointer}
.iconbtn .dot{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;font-weight:700}
.burger{display:none}
.view{flex:1;overflow-y:auto;padding:20px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb a{color:var(--muted)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card>h2,.card>.ch{margin-bottom:10px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--brass)}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .s{font-size:12px;color:var(--muted)}
.stat.alert{box-shadow:inset 3px 0 0 var(--warn)}
.stat.crit{box-shadow:inset 3px 0 0 var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.pri:hover{background:var(--brass-strong)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:160px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:110px;font-family:var(--mono);font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.f input,label.f select{color:var(--text);font-size:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--brass)}
.tabs .c{font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.switch i{width:34px;height:20px;border-radius:10px;background:var(--idle-soft);border:1px solid var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--idle);transition:left .15s}
.switch.on i{background:var(--good)} .switch.on i::after{left:16px;background:#fff}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-act]{cursor:pointer}
th[data-act]:hover{color:var(--text)}
td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}

/* pills & meters */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);margin:0 4px 4px 0}
.meter{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:60px}
.meter b{display:block;height:100%;background:var(--good);border-radius:4px}
.meter.warn b{background:var(--warn)} .meter.bad b{background:var(--bad)} .meter.brass b{background:var(--brass)}
.stars{color:var(--brass);letter-spacing:1px;white-space:nowrap}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .d{font-size:12.5px;color:var(--muted)}
.alert-li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--warn);text-decoration:none;color:inherit}
.alert-li.bad{border-left-color:var(--bad)} .alert-li.info{border-left-color:var(--info)} .alert-li.good{border-left-color:var(--good)}
.alert-li:hover{background:var(--line-2)}
.stack{display:flex;flex-direction:column;gap:8px}

/* rooms grid */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--idle)}
.tile:hover{border-color:var(--muted)}
.tile b{font-family:var(--display);font-size:18px}
.tile.good{border-top-color:var(--good)} .tile.info{border-top-color:var(--info)} .tile.warn{border-top-color:var(--warn)} .tile.bad{border-top-color:var(--bad)} .tile.brass{border-top-color:var(--brass)}
.fac{border:1px dashed var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2)}
.statusbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.statusbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* profile */
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:54px;height:54px;border-radius:12px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.timeline{display:flex;flex-direction:column}
.timeline .li .when{font-family:var(--mono);font-size:12px;color:var(--muted);width:118px;flex:none}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal .mb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px}
.notes{position:fixed;top:56px;right:14px;width:min(380px,calc(100% - 28px));max-height:70%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.2);z-index:40;padding:6px 14px}
.toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;border-left:4px solid var(--brass);max-width:360px}
.toast.bad{border-left-color:var(--bad)} .toast.good{border-left-color:var(--good)}
.check{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.check .ic.y{background:var(--good-soft);color:var(--good)} .check .ic.n{background:var(--bad-soft);color:var(--bad)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.opt.best{border-color:var(--brass);background:var(--brass-soft)}
.bill td{padding:6px 4px}
.bill tr.tot td{font-weight:700;border-top:2px solid var(--text);font-size:15px}

/* setup */
.setup{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--ink)}
.setup .box{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:26px;display:flex;flex-direction:column;gap:16px}
.setup h1{font-size:30px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px;text-align:left;cursor:pointer}
.seg button b{display:block;font-family:var(--display);font-size:15px}
.seg button span{font-size:12.5px;color:var(--muted)}
.seg button.on{border-color:var(--brass);background:var(--brass-soft)}
.blocker{position:fixed;inset:0;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:100;padding:20px;text-align:center}
.blocker .btn{margin-top:14px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid line{stroke:var(--line-2)}

@media (max-width: 1000px){
  .g3{grid-template-columns:1fr 1fr}
  .g32{grid-template-columns:1fr}
}
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:45;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,18,22,.45)}
  .burger{display:inline-flex}
  .top{padding:8px 12px;gap:8px}
  .view{padding:14px 12px}
  .g2,.g3{grid-template-columns:1fr}
  .burger{order:-3}
  .top .hname{order:-2;flex:1 1 calc(100% - 120px)}
  .top .iconbtn[data-act=notes]{order:-1}
  .toasts{left:12px;right:12px;bottom:12px}
  .toast{max-width:none;padding:8px 12px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"><div class="setup"><div class="box"><h1>Hotel Authority</h1><p class="muted">Loading your hotel…</p></div></div></div>
<div id="modal"></div>
<div id="notes"></div>
<div class="toasts" id="toasts"></div>
<div id="blocker"></div>
<script>
"use strict";
/* ============================ DATA ============================ */
const ROOM_TYPES={
  single:{label:"Single",beds:"1 Twin",max:1,price:89,cost:2500,space:2,clean:30,q:1},
  double:{label:"Double",beds:"2 Twin",max:2,price:119,cost:3200,space:2,clean:35,q:2},
  queen:{label:"Queen",beds:"1 Queen",max:2,price:139,cost:3800,space:2,clean:40,q:3},
  king:{label:"King",beds:"1 King",max:2,price:169,cost:4800,space:3,clean:45,q:4},
  deluxe:{label:"Deluxe",beds:"1 King + sofa bed",max:3,price:219,cost:7500,space:3,clean:55,q:5},
  executive:{label:"Executive",beds:"1 King + office",max:2,price:289,cost:11000,space:4,clean:60,q:6},
  family:{label:"Family suite",beds:"2 Queen + bunk",max:5,price:329,cost:12500,space:4,clean:75,q:5},
  penthouse:{label:"Penthouse",beds:"1 Super King + lounge",max:4,price:699,cost:32000,space:6,clean:120,q:9}
};
const RT_KEYS=Object.keys(ROOM_TYPES);
const FAC_TYPES={
  reception:{label:"Reception",cost:0,op:0,space:4,dept:"Reception",rev:"—",core:true},
  restaurant:{label:"Restaurant",cost:0,op:90,space:8,dept:"Kitchen",rev:"Meals",core:true},
  gym:{label:"Gym",cost:18000,op:60,space:4,dept:"Fitness",rev:"Day passes"},
  pool:{label:"Swimming pool",cost:45000,op:150,space:8,dept:"Fitness",rev:"Guest satisfaction"},
  spa:{label:"Spa",cost:38000,op:120,space:6,dept:"Spa",rev:"Treatments"},
  shop:{label:"Gift shop",cost:9000,op:30,space:3,dept:"Guest services",rev:"Retail"},
  bar:{label:"Rooftop bar",cost:30000,op:100,space:5,dept:"Restaurant",rev:"Drinks"},
  conference:{label:"Conference center",cost:52000,op:140,space:6,dept:"Guest services",rev:"Events"},
  business:{label:"Business center",cost:12000,op:35,space:3,dept:"Guest services",rev:"Services"},
  parking:{label:"Parking garage",cost:35000,op:50,space:8,dept:"Security",rev:"Parking fees"},
  kids:{label:"Kids club",cost:16000,op:60,space:4,dept:"Guest services",rev:"Activities"},
  laundry:{label:"Laundry",cost:8000,op:40,space:3,dept:"Housekeeping",rev:"Faster cleaning"},
  storage:{label:"Storage",cost:4000,op:10,space:2,dept:"—",rev:"Bigger pantry"},
  staff:{label:"Employee lounge",cost:7000,op:20,space:3,dept:"—",rev:"Staff performance"}
};
const AMENITIES={
  minibar:{label:"Minibar",cost:600,sat:1},
  tv:{label:"Smart TV",cost:500,sat:2},
  coffee:{label:"Coffee machine",cost:250,sat:1},
  bedding:{label:"Premium bedding",cost:900,sat:3},
  desk:{label:"Work desk",cost:700,sat:1,biz:4},
  jacuzzi:{label:"Jacuzzi",cost:4000,sat:5,minQ:5}

  };

function addFloor(instant){

  G.floors.push(f);return f;
}
const floorCost=n=>40000+15000*Math.max(0,n-3);
const floorUsed=fid=>G.rooms.filter(r=>r.floorId===fid).reduce((s,r)=>s+ROOM_TYPES[r.cat].space,0)+G.facilities.filter(f=>f.floorId===fid).reduce((s,f)=>s+FAC_TYPES[f.type].space,0);
const floorOf=id=>G.floors.find(f=>f.id===id);
function addRoom(fid,cat,instant){
  const fl=floorOf(fid);const nums=G.rooms.filter(r=>r.floorId===fid).map(r=>r.number%100);let i=1;while(nums.includes(i))i++;
  const t=ROOM_TYPES[cat];
  const r={id:"RM"+String(++G.seq.rm).padStart(4,"0"),number:fl.number*100+i,floorId:fid,cat,price:t.price,status:"available",guestId:null,clean:100,amen:[],history:[],built:G.clock.m};
  if(!instant){addTx("expense","construction",t.cost,`Built ${t.label} room ${r.number}`)}
  G.rooms.push(r);G.rooms.sort((a,b)=>a.number-b.number);return r;
}

function genGuest(pk){
  const p=PERS[pk]||PERS[wpick(Object.fromEntries(PERS_KEYS.map(k=>[k,PERS[k].w*campaignBias(k)])))];
  const key=pk||PERS_KEYS.find(k=>PERS[k]===p);
  const id="G"+(++G.seq.g);
  const g={id,name:pick(FIRST)+" "+pick(LAST),age:rint(p.age[0],p.age[1]),pers:key,prefs:sample(PREFS,rint(1,3)),budget:rint(p.budget[0],p.budget[1]),
    sat:p.sat+rint(-4,4),act:"Not yet arrived",loc:"—",log:[],spend:{},stays:[],reviews:[],complaints:[],status:"prospect",created:G.clock.m,stayId:null};
  G.guests[id]=g;return g;
}
function campaignBias(k){let b=1;for(const c in G.campaigns)if(G.campaigns[c]&&CAMPAIGNS[c].bias===k)b+=1.2;return b}

/* ============================ ECONOMY ============================ */
function addTx(type,cat,amt,desc){
  amt=Math.round(amt);if(!amt)return;
  const t={id:"TX"+(++G.seq.tx),m:G.clock.m,type,cat,amt,desc};
  G.tx.unshift(t);if(G.tx.length>1200)G.tx.length=1200;
  if(type==="revenue"){G.balance+=amt;G.totals.rev+=amt;G.todayRev+=amt}else{G.balance-=amt;G.totals.exp+=amt;G.todayExp+=amt}
  G.todayCat[type+":"+cat]=(G.todayCat[type+":"+cat]||0)+amt;
}
function canAfford(n){return G.balance>=n}
function note(level,text,link){
  G.notes.unshift({id:++G.seq.n,m:G.clock.m,level,text,link,read:false});if(G.notes.length>80)G.notes.length=80;
  if(level==="bad"||level==="warn"||level==="good")toast(text,level);
}
function demandMult(){let m=1;for(const c in G.campaigns)if(G.campaigns[c])m+=CAMPAIGNS[c].boost;return m*(0.45+G.rating/4.5)}
function occupiedRooms(){return G.rooms.filter(r=>r.guestId).length}

/* ============================ RESERVATIONS ============================ */
function resEnd(r){return r.status==="inhouse"?Math.max(r.arrival+r.nights,today()+1):r.arrival+r.nights}
function roomFree(roomId,from,to,excl){
  return !G.reservations.some(r=>r.roomId===roomId&&r.id!==excl&&(r.status==="accepted"||r.status==="inhouse")&&from<resEnd(r)&&to>r.arrival);
}
function ownedTypes(){return [...new Set(G.rooms.map(r=>r.cat))]}
function genReservation(arrOffset){
  const g=genGuest();const p=PERS[g.pers];
  let type;const owned=ownedTypes().filter(t=>p.types[t]);
  if(owned.length&&rnd()<.65)type=wpick(Object.fromEntries(owned.map(t=>[t,p.types[t]])));
  else if(rnd()<.35&&ownedTypes().length)type=pick(ownedTypes());
  else type=wpick(p.types);
  const party=Math.min(rint(p.party[0],p.party[1]),ROOM_TYPES[type].max);
  const arrival=today()+(arrOffset!==undefined?arrOffset:(hourOf(G.clock.m)>=20?rint(1,3):rint(0,3)));
  const nights=g.pers==="business"?rint(1,3):rint(1,5);
  const rate=typeRate(type);
  const r={id:"R"+(++G.seq.r),guestId:g.id,party,type,arrival,nights,budget:g.budget,special:rnd()<.5?pick(SPECIAL):"None",est:rate*nights,status:"pending",created:G.clock.m,roomId:null,rate:null,source:"Online",stayId:null};
  G.reservations.unshift(r);g.status="prospect";
  return r;
}
function typeRate(t){const rs=G.rooms.filter(r=>r.cat===t);return rs.length?Math.round(rs.reduce((s,r)=>s+r.price,0)/rs.length):ROOM_TYPES[t].price}
function genWalkin(){
  const g=genGuest();const p=PERS[g.pers];
  const owned=ownedTypes();const type=owned.length&&rnd()<.7?pick(owned):wpick(p.types);
  G.walkins.push({id:"W"+(++G.seq.r),guestId:g.id,type,party:Math.min(rint(p.party[0],p.party[1]),ROOM_TYPES[type].max),nights:rint(1,3),arrived:G.clock.m});
  g.act="Waiting at reception";g.loc="Reception";
  note("info",`Walk-in guest ${g.name} is waiting at reception.`,"reception");
}
function purgeGuest(gid){const g=G.guests[gid];if(g&&g.status==="prospect"&&!g.stays.length)delete G.guests[gid]}
function declineRes(id,why){
  const r=G.reservations.find(x=>x.id===id);if(!r||r.status!=="pending")return;
  r.status=why==="expired"?"expired":"declined";r.closed=G.clock.m;purgeGuest(r.guestId);
}
function acceptRes(id,roomId){
  const r=G.reservations.find(x=>x.id===id);const room=G.rooms.find(x=>x.id===roomId);const g=G.guests[r.guestId];
  if(!r||r.status!=="pending")return {ok:false,msg:"This request is no longer pending."};
  if(ROOM_TYPES[room.cat].max<r.party)return {ok:false,msg:`Room ${room.number} sleeps ${ROOM_TYPES[room.cat].max}; the party is ${r.party}.`};
  if(!roomFree(room.id,r.arrival,r.arrival+r.nights))return {ok:false,msg:`Room ${room.number} is already booked for those dates.`};
  if(["maintenance","out_of_service"].includes(room.status))return {ok:false,msg:`Room ${room.number} is out of service.`};
  if(room.cat!==r.type){
    const ratio=room.price/r.budget;const down=ROOM_TYPES[room.cat].q<ROOM_TYPES[r.type].q;
    let pAccept=ratio<=1.05?.9:ratio<=1.3?.5:.12;if(down)pAccept*=.7;
    if(rnd()>pAccept){r.status="declined";r.closed=G.clock.m;r.declinedBy="guest";purgeGuest(g.id);return {ok:false,guest:true,msg:`${g.name} turned down the ${ROOM_TYPES[room.cat].label} room at ${money(room.price)}/night.`}}
    if(down)g.sat-=5;
  }
  r.status="accepted";r.roomId=room.id;r.rate=room.price;r.est=room.price*r.nights;r.closed=G.clock.m;g.status="reserved";g.act="Reservation confirmed";
  return {ok:true,msg:`Reservation ${r.id} confirmed for ${g.name} in room ${room.number}.`};
}

/* ============================ CHECK-IN / OUT ============================ */
function checkinIssues(r,roomId){
  const room=G.rooms.find(x=>x.id===(roomId||r.roomId));
  const out=[{ok:true,label:`Reservation ${r.id} located`}];
  out.push({ok:!!room,label:room?`Room ${room.number} assigned`:"No room assigned"});
  if(!room)return out;
  out.push({ok:!room.guestId,label:room.guestId?`Room ${room.number} is still occupied`:`Room ${room.number} is vacant`});
  out.push({ok:room.status==="available",label:room.status==="available"?"Room is clean and inspected":`Room is not ready (${STATUS[room.status][0]})`});
  out.push({ok:ROOM_TYPES[room.cat].max>=r.party,label:`Sleeps ${ROOM_TYPES[room.cat].max} · party of ${r.party}`});
  out.push({ok:r.arrival+r.nights>today(),label:r.arrival+r.nights>today()?`Departs Day ${r.arrival+r.nights}`:"Stay dates have already passed"});
  return out;
}
function doCheckin(resId,roomId){
  const r=G.reservations.find(x=>x.id===resId);const g=G.guests[r.guestId];
  if(roomId&&roomId!==r.roomId){
    const nr=G.rooms.find(x=>x.id===roomId);
    if(!roomFree(nr.id,today(),r.arrival+r.nights,r.id))return {ok:false,msg:"That room is booked for these dates."};
    if(ROOM_TYPES[nr.cat].q<ROOM_TYPES[G.rooms.find(x=>x.id===r.roomId)?.cat||r.type].q){g.sat-=6;r.rate=Math.min(r.rate,nr.price)}
    r.roomId=nr.id;
  }

function walkinCheckin(wid,roomId){

function charge(s,cat,desc,amt){amt=Math.round(amt);if(amt<=0)return;s.charges.push({m:G.clock.m,cat,desc,amt});const g=G.guests[s.guestId];g.spend[cat]=(g.spend[cat]||0)+amt}

/* ============================ HOUSEKEEPING & STAFF ============================ */
function onDuty(e,h){const [a,b]=SHIFTS[e.shift];h=h??hourOf(G.clock.m);return e.status==="active"&&(a<b?h>=a&&h<b:h>=a||h<b)}
function addTask(roomId,type,pri){
  if(G.tasks.some(t=>t.roomId===roomId&&t.status!=="done"&&t.type===type))return;
  const room=G.rooms.find(r=>r.id===roomId);const base=ROOM_TYPES[room.cat].clean;
  const dur=type==="Stayover clean"?Math.round(base*.6):type==="Deep clean"?base*2:base;
  G.tasks.unshift({id:"HK"+(++G.seq.t),roomId,type,pri,status:"pending",empId:null,created:G.clock.m,base:dur,progress:0,dur:0,started:null,finished:null});
}
function taskDuration(t,e){const room=G.rooms.find(r=>r.id===t.roomId);let d=t.base*(1+(100-room.clean)/250)*(1.45-e.skill/100*.8);if(hasFac("laundry"))d*=.85;if(hasFac("staff"))d*=.95;return Math.max(5,Math.round(d))}
function assignTask(tid,eid){
  const t=G.tasks.find(x=>x.id===tid),e=G.employees.find(x=>x.id===eid);
  if(!t||!e||t.status!=="pending")return {ok:false,msg:"Task can't be assigned."};
  if(e.assign)return {ok:false,msg:`${e.name} is busy.`};
  if(!onDuty(e))return {ok:false,msg:`${e.name} is off shift (${e.shift}).`};
  t.status="progress";t.empId=e.id;t.dur=taskDuration(t,e);t.started=t.started||G.clock.m;e.assign={kind:"task",id:t.id};
  const room=G.rooms.find(r=>r.id===t.roomId);if(!room.guestId)room.status="cleaning";
  return {ok:true,msg:`${e.name} is cleaning room ${room.number} (≈${t.dur-Math.round(t.progress*t.dur)} min).`};
}
function hkTick(){
  for(const t of G.tasks){
    if(t.status!=="progress")continue;
    const e=G.employees.find(x=>x.id===t.empId);const room=G.rooms.find(r=>r.id===t.roomId);
    if(!e||!onDuty(e)){t.status="pending";t.empId=null;if(e)e.assign=null;if(!room.guestId)room.status="cleaning_required";continue}
    t.progress+=1/t.dur;
    if(t.progress>=1){
      t.progress=1;t.finished=G.clock.m;e.assign=null;e.done++;e.perf=clamp(e.perf+.4,0,100);if(rnd()<.05)e.skill=Math.min(99,e.skill+1);
      if(t.type==="Stayover clean"||room.guestId){t.status="done";room.clean=100;if(room.guestId){const g=G.guests[room.guestId];g.sat=clamp(g.sat+1,0,100)}}
      else{t.status="inspection";room.status="inspection";room.clean=100}
    }
  }
  if(G.settings.autoHK)autoAssignHK();
  if(G.tasks.length>260){const keep=G.tasks.filter(t=>t.status!=="done");const done=G.tasks.filter(t=>t.status==="done").slice(0,200);G.tasks=keep.concat(done)}
}
function autoAssignHK(){
  const pend=G.tasks.filter(t=>t.status==="pending").sort((a,b)=>(b.pri==="high")-(a.pri==="high")||a.created-b.created);
  for(const t of pend){const e=G.employees.filter(x=>x.dept==="Housekeeping"&&!x.assign&&onDuty(x)).sort((a,b)=>b.skill-a.skill)[0];if(!e)break;assignTask(t.id,e.id)}

function inspect(tid){

/* requests */
function genRequest(g,typeKey){

  G.requests.unshift({id:"RQ"+(++G.seq.q),guestId:g.id,roomId:room.id,type:typeKey,dept:T.dept,pri:T.pri,status:"open",empId:null,created:G.clock.m,dur:T.dur,progress:0,charge:T.charge?Math.round(rint(T.charge[0],T.charge[1])*PERS[g.pers].spend):0,complained:false});

function assignReq(qid,eid){

function hasFac(t){return G.facilities.some(f=>f.type===t&&f.status==="open"&&floorOf(f.floorId).status==="open")}
function facOf(t){return G.facilities.find(f=>f.type===t&&f.status==="open")}
function servingNow(){const h=hourOf(G.clock.m);for(const k in G.restaurant.services){const s=G.restaurant.services[k];if(s.on&&h>=s.open&&h<s.close)return k}return null}
function restStaffed(){const h=hourOf(G.clock.m);return G.employees.some(e=>e.dept==="Kitchen"&&onDuty(e,h))&&G.employees.some(e=>e.dept==="Restaurant"&&onDuty(e,h))}
function menuAvg(svc){const items=G.restaurant.menu.filter(m=>m.on&&m.svc===svc);if(!items.length)return 0;return items.reduce((s,m)=>s+m.price,0)/items.length}
function priceRatio(){const items=G.restaurant.menu.filter(m=>m.on);if(!items.length)return 1;return items.reduce((s,m)=>s+m.price/m.base,0)/items.length}

  else{add("Watching television",3,"room");add("Resting",3,"room");add("Sleeping",3,"room");if(hasFac("bar"))add("Drinks at the rooftop bar",1.5,"bar")}
  let t=o.reduce((a,x)=>a+x[1],0),r=rnd()*t;for(const x of o){if((r-=x[1])<=0)return x}return o[0];
}

/* ============================ CLOCK ============================ */
function stepMinute(){
  G.clock.m++;const m=G.clock.m,h=hourOf(m),mi=m%60,d=today();
  for(const f of G.floors)if(f.status==="construction"&&m>=f.readyAt){f.status="open";note("good",`${f.name} construction is complete.`,"floor-"+f.id)}
  hkTick();reqTick();
  if(mi%15===0)activitiesTick([6,9,12,14,18,22,23].includes(h)&&mi===0);
  const pendN=G.reservations.filter(r=>r.status==="pending").length;
  const rate=(0.004+0.0016*G.rooms.length)*demandMult();
  if(pendN<25&&rnd()<rate)genReservation();
  if(h>=8&&h<23&&G.walkins.length<4&&rnd()<0.0018*demandMult()*(1+G.rooms.length/10))genWalkin();
  for(const r of G.reservations)if(r.status==="pending"&&m-r.created>360)declineRes(r.id,"expired");
  for(const w of G.walkins.slice())if(m-w.arrived>75){G.walkins=G.walkins.filter(x=>x!==w);const g=G.guests[w.guestId];if(g){note("warn",`${g.name} gave up waiting at reception and left.`,"reception");purgeGuest(g.id)}}
  if(mi===0){
    for(const sid in G.stays){const s=G.stays[sid];
      if(s.status==="active"&&(d>s.departDay||(d===s.departDay&&h>=11))){s.status="due";s.dueSince=m;const room=G.rooms.find(r=>r.id===s.roomId);room.status="checkout_due";const g=G.guests[s.guestId];g.act="Waiting to check out";g.loc="Reception";logAct(g,"Checkout due","Reception");note("warn",`${g.name} (room ${room.number}) is ready to check out.`,"reception")}
      else if(s.status==="due"){const g=G.guests[s.guestId];g.sat=clamp(g.sat-1.5,0,100)}
    }
    if(h===10&&G.settings.stayover)for(const r of G.rooms)if(r.guestId&&r.clean<75)addTask(r.id,"Stayover clean","low");
    if(rnd()<.03*G.rooms.filter(r=>r.guestId).length){const rm=pick(G.rooms.filter(r=>r.guestId));if(rm&&!rm.issue){rm.issue=pick(["Leaking tap","Air conditioning fault","TV not working","Broken lamp","Slow drain"]);const g=G.guests[rm.guestId];genRequest(g,"maint")}}
    if(h===10||h===14||h===22)outsideDiners(h===10?"breakfast":h===14?"lunch":"dinner");
    checkGoals();
  }
  if(m%1440===0)endOfDay(d-1);
  dirty=true;
}
function outsideDiners(svc){
  const s=G.restaurant.services[svc];if(!s.on)return;
  const staffed=G.employees.some(e=>e.dept==="Kitchen"&&onDuty(e,s.open))&&G.employees.some(e=>e.dept==="Restaurant"&&onDuty(e,s.open));
  if(!staffed){note("warn",`Restaurant ${svc} service had no kitchen or floor staff on shift.`,"restaurant");return}
  const avg=menuAvg(svc);if(!avg)return;
  const qf=clamp(1.6-priceRatio()*.6,.2,1.3);
  let covers=Math.round(G.restaurant.seats*(.12+rnd()*.2)*(0.5+G.rating/5)*qf*(s.close-s.open)/3);
  covers=Math.min(covers,Math.floor(G.restaurant.stock));if(covers<=0)return;
  G.restaurant.stock-=covers;const amt=covers*avg;addTx("revenue","restaurant",amt,`Restaurant ${svc} — ${covers} outside covers`);
  G.restaurant.todayCovers+=covers;G.restaurant.todayRev+=amt;G.stats.outsideCovers+=covers;
}
function endOfDay(day){
  // nightly room charges
  for(const sid in G.stays){const s=G.stays[sid];const room=G.rooms.find(r=>r.id===s.roomId);s.nights++;charge(s,"room",`Night ${s.nights} — Room ${room.number}`,s.rate);
    if(room.amen.includes("minibar")&&rnd()<.5)charge(s,"other","Minibar",rint(8,34));
    if(s.parking)charge(s,"parking","Parking",G.prices.parking);
    room.clean=Math.max(0,room.clean-rint(18,30));if(room.clean<45){const g=G.guests[s.guestId];g.sat=clamp(g.sat-4,0,100)}}
  // expenses
  const wages=G.employees.filter(e=>e.status==="active").reduce((s,e)=>s+e.wage,0);addTx("expense","salaries",wages,`Daily wages — ${G.employees.length} employees`);
  addTx("expense","utilities",14*G.rooms.length+50*G.floors.filter(f=>f.status==="open").length,"Electricity, water and internet");
  addTx("expense","maintenance",40*G.floors.length+6*G.rooms.length,"Building maintenance");
  const op=G.facilities.filter(f=>f.status==="open").reduce((s,f)=>s+FAC_TYPES[f.type].op,0);addTx("expense","facility",op,"Facility operating costs");
  const mk=Object.keys(G.campaigns).filter(c=>G.campaigns[c]).reduce((s,c)=>s+CAMPAIGNS[c].cost,0);addTx("expense","marketing",mk,"Marketing campaigns");
  addTx("expense","food",G.stays&&Object.keys(G.stays).length*6,"Guest supplies and toiletries");
  // no-shows
  for(const r of G.reservations)if(r.status==="accepted"&&r.arrival<=day-1){r.status="noshow";r.closed=G.clock.m;const g=G.guests[r.guestId];g.status="departed";g.act="No-show";addTx("revenue","room",Math.round(r.rate*.5),`No-show fee — ${g.name}`);note("warn",`${g.name} was a no-show. 50% of one night charged.`,"reservations")}
  if(G.reservations.length>500){const live=G.reservations.filter(r=>["pending","accepted","inhouse"].includes(r.status));G.reservations=live.concat(G.reservations.filter(r=>!live.includes(r)).slice(0,350))}
  // stats
  const occ=G.rooms.length?occupiedRooms()/G.rooms.length:0;const rr=G.todayCat["revenue:room"]||0;const nightsSold=occupiedRooms();
  const sats=Object.values(G.stays).map(s=>G.guests[s.guestId].sat);
  G.days.push({day,rev:G.todayRev,exp:G.todayExp,occ,rooms:G.rooms.length,sold:nightsSold,adr:nightsSold?Object.values(G.stays).reduce((a,s)=>a+s.rate,0)/nightsSold:0,sat:sats.length?sats.reduce((a,b)=>a+b,0)/sats.length:null,rating:G.rating,cats:G.todayCat,covers:G.restaurant.todayCovers});
  G.todayRev=0;G.todayExp=0;G.todayCat={};G.restaurant.todayCovers=0;G.restaurant.todayRev=0;
  if(G.settings.autoRestock&&G.restaurant.stock<G.restaurant.cap*.35)restock(true);
  if(G.days.length%2===0)refreshCandidates();
  if(G.balance<0)note("bad",`Your balance is negative (${money(G.balance)}). Cut costs or raise revenue.`,"finance");
  note("info",`Day ${day} closed: ${money(G.days.at(-1).rev)} revenue, ${money(G.days.at(-1).exp)} expenses.`,"finance");
}
function restock(auto){const need=Math.floor(G.restaurant.cap-G.restaurant.stock);if(need<=0)return {ok:false,msg:"The pantry is already full."};const cost=need*5;if(!canAfford(cost)&&!auto)return {ok:false,msg:`Restocking costs ${money(cost)}.`};G.restaurant.stock+=need;addTx("expense","food",cost,`${auto?"Auto-restock":"Restock"}: ${need} portions`);return {ok:true,msg:`Bought ${need} portions for ${money(cost)}.`}}
function checkGoals(){
  if(G.mode==="career")for(const o of OBJECTIVES){if(G.objectives[o.id])continue;if(o.test(G)){G.objectives[o.id]=G.clock.m;addTx("revenue","bonus",o.reward,`Objective reward: ${o.label}`);
    (o.unlock.rooms||[]).forEach(r=>G.unlocks.rooms.includes(r)||G.unlocks.rooms.push(r));(o.unlock.facs||[]).forEach(f=>G.unlocks.facs.includes(f)||G.unlocks.facs.push(f));
    note("good",`Objective complete: ${o.label}. ${money(o.reward)} awarded.${o.note?" "+o.note+".":""}`,"administration")}break}
  for(const a of ACHIEVEMENTS)if(!G.achievements[a.id]&&a.test(G)){G.achievements[a.id]=G.clock.m;note("good",`Achievement unlocked: ${a.label}`,"administration")}
}

VIEWS.reception=()=>{

  if(U.rec.tab==="walkins")body=tableHTML([{h:"Guest"},{h:"Wants"},{h:"Nights"},{h:"Party"},{h:"Budget"},{h:"Waiting"},{h:""}],G.walkins.map(w=>{const g=G.guests[w.guestId];return `<tr><td>${esc(g.name)}<div class="small muted">${PERS[g.pers].label}</div></td><td>${ROOM_TYPES[w.type].label}</td><td>${w.nights}</td><td>${w.party}</td><td>${money(g.budget)}/night</td><td>${G.clock.m-w.arrived} min</td><td class="r row" style="justify-content:flex-end"><button class="btn sm pri" data-act="walkin" data-id="${w.id}">Assign room</button><button class="btn sm" data-act="walkinNo" data-id="${w.id}">Turn away</button></td></tr>`}),{empty:"No walk-in guests at the desk right now."});
  if(U.rec.tab==="due")body=tableHTML([{h:"Guest"},{h:"Room"},{h:"Departure"},{h:"Waiting"},{h:"Balance",r:1},{h:""}],due.map(s=>{const g=G.guests[s.guestId];return `<tr><td>${guestLink(g.id)}</td><td>${roomLink(s.roomId)}</td><td>Day ${s.departDay}</td><td>${Math.round((G.clock.m-s.dueSince)/60*10)/10} h</td><td class="r">${money(billOf(s).total)}</td><td class="r row" style="justify-content:flex-end"><button class="btn sm pri" data-act="checkout" data-id="${s.id}">Check out</button><button class="btn sm" data-act="extend" data-id="${s.id}">Extend 1 night</button></td></tr>`}),{empty:"No guests due to check out. Guests become due at 11:00 AM on their departure day."});
  if(U.rec.tab==="inhouse")body=tableHTML([{h:"Guest"},{h:"Room"},{h:"Departs"},{h:"Activity"},{h:"Satisfaction"},{h:"Folio",r:1},{h:""}],ih.map(s=>{const g=G.guests[s.guestId];return `<tr><td>${guestLink(g.id)}</td><td>${roomLink(s.roomId)}</td><td>Day ${s.departDay}${s.status==="due"?" "+pill("Due","warn"):""}</td><td class="small">${esc(g.act)}</td><td>${meter(g.sat)}</td><td class="r">${money(billOf(s).total)}</td><td class="r row" style="justify-content:flex-end"><button class="btn sm" data-act="extend" data-id="${s.id}">Extend</button><button class="btn sm" data-act="checkout" data-id="${s.id}">${s.status==="due"?"Check out":"Early checkout"}</button></td></tr>`}),{empty:"No guests in house."});
  return `${phead("Reception","Front desk: process arrivals, walk-ins and departures manually.")}
  <div class="card">${tabs("rec",U.rec,[["arrivals","Arrivals",arr.length],["walkins","Walk-ins",G.walkins.length],["due","Checkouts due",due.length],["inhouse","In house",ih.length]])}${body}</div>`;

VIEWS.reservations=()=>{
  const S=U.res;let list=G.reservations.filter(r=>S.tab==="pending"?r.status==="pending":S.tab==="upcoming"?r.status==="accepted":true);
  if(S.type!=="all")list=list.filter(r=>r.type===S.type);
  if(S.q){const q=S.q.toLowerCase();list=list.filter(r=>(G.guests[r.guestId]?.name||"").toLowerCase().includes(q)||r.id.toLowerCase().includes(q)||r.guestId.toLowerCase().includes(q))}
  list=sorter(list.slice(),S,{arrival:r=>r.arrival,est:r=>r.est,nights:r=>r.nights,created:r=>r.created,budget:r=>r.budget});
  const pg=paginate(list,S);
  const stCls={pending:"warn",accepted:"info",inhouse:"brass",completed:"good",declined:"idle",expired:"idle",noshow:"bad"};
  const rows=pg.slice.map(r=>{const g=G.guests[r.guestId];const nm=g?esc(g.name):"Guest record removed";
    const acts=r.status==="pending"?`<button class="btn sm pri" data-act="assignRes" data-id="${r.id}">Accept / assign</button><button class="btn sm" data-act="declineRes" data-id="${r.id}">Decline</button>`:(r.status==="accepted"?`<button class="btn sm" data-act="cancelRes" data-id="${r.id}">Cancel</button>`:"");
    return `<tr><td>${g?`<a href="#guest-${g.id}">${nm}</a>`:nm}<div class="small muted mono">${r.guestId}${g?" · "+PERS[g.pers].label:""}</div></td><td class="mono">${r.id}<div class="small muted">${r.source}</div></td><td>${ROOM_TYPES[r.type].label}${r.roomId?`<div class="small">Room ${roomLink(r.roomId)}</div>`:""}</td><td>Day ${r.arrival} → ${r.arrival+r.nights}<div class="small muted">${r.nights} night${r.nights>1?"s":""} · party ${r.party}</div></td><td>${money(r.budget)}</td><td class="small" style="max-width:160px">${esc(r.special)}</td><td class="r">${money(r.est)}</td><td>${pill(r.status==="noshow"?"No-show":r.status==="inhouse"?"In house":r.status[0].toUpperCase()+r.status.slice(1),stCls[r.status])}${r.status==="pending"?`<div class="small muted">expires in ${Math.max(0,Math.round((360-(G.clock.m-r.created))/60))} h</div>`:""}</td><td class="r"><div class="row" style="justify-content:flex-end">${acts}</div></td></tr>`});
  return `${phead("Reservations","Requests arrive automatically. Accepting assigns a room; it does not check the guest in.")}
  <div class="card">${tabs("res",S,[["pending","Pending",G.reservations.filter(r=>r.status==="pending").length],["upcoming","Confirmed",G.reservations.filter(r=>r.status==="accepted").length],["all","All history",G.reservations.length]])}
  <div class="toolbar">${search("q-res","res",S.q,"Search guest, guest ID or reservation ID")}${sel("f-res-type","res","type",S.type,[["all","All room types"],...RT_KEYS.map(k=>[k,ROOM_TYPES[k].label])])}</div>
  ${tableHTML([{h:"Guest"},{h:"Reservation",sort:"created"},{h:"Room type"},{h:"Dates",sort:"arrival"},{h:"Budget/night",sort:"budget"},{h:"Special requests"},{h:"Est. revenue",r:1,sort:"est"},{h:"Status"},{h:""}],rows,{sortKey:"res",state:S,empty:S.tab==="pending"?"No pending requests right now. Keep the clock running; demand grows with rooms, rating and marketing.":"No reservations match."})}${pg.html}</div>`;
};

VIEWS.guests=()=>{
  const S=U.guests;let list=Object.values(G.guests).filter(g=>g.status!=="prospect"||S.status==="all");
  if(S.status!=="all")list=list.filter(g=>g.status===S.status);
  if(S.pers!=="all")list=list.filter(g=>g.pers===S.pers);
  if(S.q){const q=S.q.toLowerCase();list=list.filter(g=>g.name.toLowerCase().includes(q)||g.id.toLowerCase().includes(q))}
  list=sorter(list,S,{name:g=>g.name,sat:g=>g.sat,spend:g=>Object.values(g.spend).reduce((a,b)=>a+b,0),id:g=>g.id,stays:g=>g.stays.length});
  const pg=paginate(list,S);
  const stC={inhouse:["In house","brass"],reserved:["Reserved","info"],departed:["Departed","idle"],prospect:["Prospect","idle"]};
  const rows=pg.slice.map(g=>{const s=G.stays[g.stayId];return `<tr class="click" data-act="go" data-href="#guest-${g.id}"><td><b>${esc(g.name)}</b><div class="small muted mono">${g.id}</div></td><td>${PERS[g.pers].label}</td><td>${pill(...stC[g.status])}</td><td>${s?roomLink(s.roomId):"—"}</td><td class="small">${esc(g.status==="inhouse"?g.act:g.status==="reserved"?"Arriving soon":"—")}</td><td>${meter(g.sat)}</td><td class="r">${money(Object.values(g.spend).reduce((a,b)=>a+b,0))}</td><td class="r">${g.stays.length}</td></tr>`});
  return `${phead("Guests","Every guest keeps a permanent ID and history.")}
  <div class="card"><div class="toolbar">${search("q-guests","guests",S.q,"Search by name or guest ID")}${sel("f-g-st","guests","status",S.status,[["inhouse","In house"],["reserved","Reserved"],["departed","Departed"],["all","All guests"]])}${sel("f-g-p","guests","pers",S.pers,[["all","All personalities"],...PERS_KEYS.map(k=>[k,PERS[k].label])])}</div>
  ${tableHTML([{h:"Guest",sort:"name"},{h:"Personality"},{h:"Status"},{h:"Room"},{h:"Current activity"},{h:"Satisfaction",sort:"sat"},{h:"Spend",r:1,sort:"spend"},{h:"Stays",r:1,sort:"stays"}],rows,{sortKey:"guests",state:S,empty:"No guests match. Try the “All guests” filter."})}${pg.html}</div>`;
};

VIEWS.guest=()=>{
  const g=G.guests[param];if(!g)return `${phead("Guest not found")}<div class="card"><a href="#guests">Back to guests</a></div>`;
  const s=G.stays[g.stayId];const room=s&&G.rooms.find(r=>r.id===s.roomId);const p=PERS[g.pers];
  const res=G.reservations.find(r=>r.guestId===g.id&&(r.status==="accepted"||r.status==="pending"));
  const spendTotal=Object.values(g.spend).reduce((a,b)=>a+b,0);const T=U.guestTab;
  let tab="";
  if(T==="overview"){
    tab=`<div class="grid g2"><div><h3>Profile</h3><dl class="kv" style="margin-top:8px"><dt>Guest ID</dt><dd class="mono">${g.id}</dd><dt>Age</dt><dd>${g.age}</dd><dt>Personality</dt><dd>${p.label}</dd><dt>Budget</dt><dd>${money(g.budget)}/night</dd><dt>Preferences</dt><dd>${g.prefs.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</dd><dt>Current activity</dt><dd>${esc(g.act)}</dd><dt>Location</dt><dd>${esc(g.loc)}</dd></dl></div>
    <div><h3>${s?"Current stay":res?"Upcoming reservation":"Status"}</h3>${s?`<dl class="kv" style="margin-top:8px"><dt>Room</dt><dd>${roomLink(room.id)} · ${ROOM_TYPES[room.cat].label}</dd><dt>Floor</dt><dd>${floorOf(room.floorId).name}</dd><dt>Arrived</dt><dd>${clockStr(s.checkin)}</dd><dt>Expected checkout</dt><dd>Day ${s.departDay}, 11:00 AM</dd><dt>Nights so far</dt><dd>${s.nights}</dd><dt>Rate</dt><dd>${money(s.rate)}/night</dd><dt>Folio</dt><dd>${money(billOf(s).total)}</dd></dl><div class="row" style="margin-top:12px"><button class="btn sm" data-act="extend" data-id="${s.id}">Extend 1 night</button><button class="btn sm pri" data-act="checkout" data-id="${s.id}">${s.status==="due"?"Check out":"Early checkout"}</button></div>`:res?`<dl class="kv" style="margin-top:8px"><dt>Reservation</dt><dd class="mono">${res.id}</dd><dt>Status</dt><dd>${res.status}</dd><dt>Arrival</dt><dd>Day ${res.arrival}</dd><dt>Nights</dt><dd>${res.nights}</dd><dt>Room</dt><dd>${res.roomId?roomLink(res.roomId):ROOM_TYPES[res.type].label+" requested"}</dd></dl>${res.status==="accepted"&&res.arrival<=today()?`<button class="btn sm pri" style="margin-top:12px" data-act="checkin" data-id="${res.id}">Check in</button>`:res.status==="pending"?`<button class="btn sm pri" style="margin-top:12px" data-act="assignRes" data-id="${res.id}">Review request</button>`:""}`:`<p class="muted">${g.status==="departed"?`Last stayed ${g.stays[0]?"Day "+g.stays[0].from+"–"+g.stays[0].to:""}.`:"No active booking."}</p>`}</div></div>`;
  }else if(T==="activity"){
    tab=g.log.length?`<div class="timeline">${g.log.map(l=>`<div class="li"><span class="when">${clockStr(l.m)}</span><div class="grow">${esc(l.act)} <span class="muted small">· ${esc(l.loc)}</span></div></div>`).join("")}</div>`:`<div class="empty">No activity yet.</div>`;
  }else if(T==="spending"){
    const items=s?s.charges.slice().reverse():[];
    tab=`<div class="grid g2"><div><h3>Lifetime spend by category</h3>${Object.keys(g.spend).length?`<div class="list" style="margin-top:6px">${Object.entries(g.spend).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="li"><div class="grow">${REV_CATS[c]||c}</div><div class="num">${money(v)}</div></div>`).join("")}</div>`:`<p class="muted">No spending yet.</p>`}</div>
    <div><h3>Current folio</h3>${items.length?`<div class="list" style="margin-top:6px">${items.slice(0,15).map(c=>`<div class="li"><div class="grow"><div class="small">${esc(c.desc)}</div><div class="d">${clockStr(c.m)}</div></div><div class="num">${money(c.amt)}</div></div>`).join("")}</div>`:`<p class="muted">No open folio.</p>`}</div></div>`;
  }else if(T==="requests"){
    const rq=G.requests.filter(q=>q.guestId===g.id);
    tab=`<h3>Requests</h3>${rq.length?tableHTML([{h:"Request"},{h:"Department"},{h:"Status"},{h:"Assigned"},{h:"Raised"}],rq.map(q=>`<tr><td>${REQ_TYPES[q.type].label}</td><td>${q.dept}</td><td>${reqPill(q)}</td><td>${empName(q.empId)}</td><td>${clockStr(q.created)}</td></tr>`)):`<p class="muted">No requests.</p>`}
    <h3 style="margin-top:14px">Complaints</h3>${g.complaints.length?`<div class="list">${g.complaints.map(c=>`<div class="li"><span class="when mono small muted" style="width:118px">${clockStr(c.m)}</span><div class="grow">${esc(c.text)}</div></div>`).join("")}</div>`:`<p class="muted">No complaints.</p>`}`;
  }else{
    tab=`<h3>Previous stays</h3>${g.stays.length?tableHTML([{h:"Stay"},{h:"Room"},{h:"Dates"},{h:"Nights"},{h:"Paid",r:1},{h:"Satisfaction"}],g.stays.map(x=>`<tr><td class="mono">${x.stayId}</td><td>${roomLink(x.roomId)} · ${ROOM_TYPES[x.cat].label}</td><td>Day ${x.from}–${x.to}</td><td>${x.nights}</td><td class="r">${money(x.total)}</td><td>${x.sat}</td></tr>`)):`<p class="muted">No completed stays yet.</p>`}
    <h3 style="margin-top:14px">Reviews</h3>${g.reviews.length?`<div class="list">${g.reviews.map(r=>`<div class="li"><div class="grow">${stars(r.stars)} <span class="small muted">Day ${r.day}</span><div>${esc(r.text)}</div></div></div>`).join("")}</div>`:`<p class="muted">No reviews written.</p>`}`;
  }
  const stC={inhouse:["In house","brass"],reserved:["Reserved","info"],departed:["Departed","idle"],prospect:["Prospect","idle"]};
  return `<div class="crumb"><a href="#guests">Guests</a> / ${g.id}</div>
  <div class="card"><div class="prof"><div class="avatar">${esc(g.name.split(" ").map(x=>x[0]).join(""))}</div><div style="flex:1;min-width:200px"><h1>${esc(g.name)}</h1><div class="row small muted" style="margin-top:4px"><span class="mono">${g.id}</span>${pill(...stC[g.status])}<span>${p.label}</span>${room?`<span>Room ${room.number} · ${floorOf(room.floorId).name}</span>`:""}</div></div>
  <div style="min-width:180px"><div class="small muted">Satisfaction · ${satWord(g.sat)}</div><div style="font-family:var(--display);font-size:26px;font-weight:700">${Math.round(g.sat)}</div>${meter(g.sat)}</div>
  <div style="min-width:120px"><div class="small muted">Lifetime spend</div><div style="font-family:var(--display);font-size:22px;font-weight:700">${money(spendTotal)}</div><div class="small muted">${g.stays.length} previous stay${g.stays.length===1?"":"s"}</div></div></div></div>
  <div class="card">${tabs("guestTab",{tab:T},[["overview","Overview"],["activity","Activity",g.log.length],["spending","Spending"],["requests","Requests & complaints",g.complaints.length],["history","Stays & reviews",g.stays.length]])}${tab}</div>`;
};
const reqPill=q=>pill({open:"Open",progress:"In progress",done:"Completed",failed:"Cancelled"}[q.status],{open:G.clock.m-q.created>60?"bad":"warn",progress:"info",done:"good",failed:"idle"}[q.status]);

VIEWS.floors=()=>{

  <div class="grid g3">${G.floors.map(f=>{const used=floorUsed(f.id),rs=G.rooms.filter(r=>r.floorId===f.id),fs=G.facilities.filter(x=>x.floorId===f.id);

    <div>${fs.map(x=>`<span class="chip">${FAC_TYPES[x.type].label}</span>`).join("")}${rs.slice(0,8).map(r=>`<span class="chip">${r.number}</span>`).join("")}${rs.length>8?`<span class="chip">+${rs.length-8}</span>`:""}</div>
    <div class="small muted">Maintenance ${money(40+6*rs.length)}/day</div></a>`}).join("")}</div>`;

VIEWS.floor=()=>{
  const f=G.floors.find(x=>x.id===param);if(!f)return `${phead("Floor not found")}<a href="#floors">Back</a>`;
  const used=floorUsed(f.id),free=f.cap-used,rs=G.rooms.filter(r=>r.floorId===f.id),fs=G.facilities.filter(x=>x.floorId===f.id);
  const open=f.status==="open";
  return `<div class="crumb"><a href="#floors">Floors</a> / ${esc(f.name)}</div>
  ${phead(esc(f.name),`Floor ${f.number} · ${used}/${f.cap} space used · ${free} free${f.cost?` · built for ${money(f.cost)}`:""}`,open?`<button class="btn pri" data-act="addRoomModal" data-id="${f.id}">Add guest room</button><button class="btn" data-act="addFacModal" data-id="${f.id}">Add facility</button>`:"")}
  ${open?"":`<div class="card">${pill("Under construction","warn")} <span class="muted">Ready at ${clockStr(f.readyAt)}. You can build here once it opens.</span></div>`}

  ${rs.length?`<div class="tiles">${rs.map(r=>{const s=STATUS[roomStatus(r)];return `<a class="tile ${s[1]}" href="#room-${r.id}"><b>${r.number}</b><span class="small">${ROOM_TYPES[r.cat].label} · ${money(r.price)}</span><span class="small muted">${s[0]}</span>${r.guestId?`<span class="small">${esc(G.guests[r.guestId].name)}</span>`:""}</a>`}).join("")}</div>`:`<div class="empty">No guest rooms on this floor yet.</div>`}</div>
  <div class="card"><div class="ch"><h2>Facilities</h2></div>${fs.length?`<div class="tiles">${fs.map(x=>`<div class="fac"><b>${FAC_TYPES[x.type].label}</b><span class="small muted">${FAC_TYPES[x.type].space} space · ${money(FAC_TYPES[x.type].op)}/day</span>${pill(x.status==="open"?"Open":"Closed",x.status==="open"?"good":"idle")}</div>`).join("")}</div>`:`<div class="empty">No facilities on this floor.</div>`}</div>`;
};

VIEWS.rooms=()=>{
  const S=U.rooms;let list=G.rooms.slice();
  if(S.status!=="all")list=list.filter(r=>roomStatus(r)===S.status);
  if(S.cat!=="all")list=list.filter(r=>r.cat===S.cat);
  if(S.floor!=="all")list=list.filter(r=>r.floorId===S.floor);
  if(S.q){const q=S.q.toLowerCase();list=list.filter(r=>String(r.number).includes(q)||r.id.toLowerCase().includes(q)||(r.guestId&&G.guests[r.guestId].name.toLowerCase().includes(q)))}

VIEWS.housekeeping=()=>{

  if(S.tab==="pending")list.sort((a,b)=>(b.pri==="high")-(a.pri==="high")||a.created-b.created);
  const rows=list.slice(0,60).map(t=>{const room=G.rooms.find(r=>r.id===t.roomId);const e=G.employees.find(x=>x.id===t.empId);
    const priP=t.pri==="high"?pill("High","bad"):t.pri==="low"?pill("Low","idle"):pill("Normal","info");
    let act="";if(t.status==="pending")act=`<button class="btn sm pri" data-act="assignTaskModal" data-id="${t.id}">Assign</button><button class="btn sm" data-act="prio" data-id="${t.id}">${t.pri==="high"?"Lower priority":"Prioritize"}</button>`;

    return `<tr><td>${roomLink(t.roomId)}<div class="small muted">${ROOM_TYPES[room.cat].label}</div></td><td>${t.type}<div class="small muted mono">${t.id}</div></td><td>${priP}</td><td>${e?esc(e.name):"—"}</td><td class="small">${ago(t.created)}</td><td>${meter(room.clean)}</td><td class="r"><div class="row" style="justify-content:flex-end">${act}</div></td></tr>`});

  <div class="list">${hks.map(e=>{const t=e.assign&&e.assign.kind==="task"?G.tasks.find(x=>x.id===e.assign.id):null;return `<div class="li"><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${e.shift} shift · skill ${e.skill} · ${e.done} tasks done</div></div>${!onDuty(e)?pill("Off shift","idle"):t?pill("Room "+G.rooms.find(r=>r.id===t.roomId).number,"info"):e.assign?pill("On request","info"):pill("Free","good")}</div>`}).join("")}</div>

    let act="";if(q.status==="open")act=`<button class="btn sm pri" data-act="assignReqModal" data-id="${q.id}">Dispatch</button>`;else if(q.status==="progress")act=`<div style="min-width:110px">${meter(q.progress*100,"brass")}</div>`;else act=`<span class="small muted">${q.closed?clockStr(q.closed):""}</span>`;

    let list=G.employees.slice();if(S.dept!=="all")list=list.filter(e=>e.dept===S.dept);

    const pg=paginate(list,S,15);
    body=`<div class="toolbar">${search("q-per","per",S.q,"Search employees")}${sel("f-p-d","per","dept",S.dept,[["all","All departments"],...DEPTS.map(d=>[d,d])])}</div>
    ${tableHTML([{h:"Employee"},{h:"Position"},{h:"Department"},{h:"Shift"},{h:"Skill"},{h:"Exp."},{h:"Wage/day",r:1},{h:"Performance"},{h:"Assignment"},{h:"Status"}],pg.slice.map(e=>{let a="—";if(e.assign){if(e.assign.kind==="task"){const t=G.tasks.find(x=>x.id===e.assign.id);a=t?"Cleaning "+G.rooms.find(r=>r.id===t.roomId).number:"Task"}else{const q=G.requests.find(x=>x.id===e.assign.id);a=q?REQ_TYPES[q.type].label:"Request"}}
      return `<tr class="click" data-act="empModal" data-id="${e.id}"><td><b>${esc(e.name)}</b><div class="small muted mono">${e.id}</div></td><td>${e.pos}</td><td>${e.dept}</td><td>${e.shift} <span class="small muted">${h12(SHIFTS[e.shift][0])}–${h12(SHIFTS[e.shift][1])}</span></td><td>${e.skill}</td><td>${e.exp} y</td><td class="r">${money(e.wage)}</td><td>${meter(e.perf)}</td><td class="small">${a}</td><td>${onDuty(e)?pill("On shift","good"):pill("Off shift","idle")}</td></tr>`}),{empty:"No employees match."})}${pg.html}`;
  }else{

    <div class="row" style="margin-top:12px"><span class="small muted">Need someone specific?</span>${sel("f-hd","per","hireDept",S.hireDept||"Housekeeping",DEPTS.map(d=>[d,d]))}<button class="btn sm" data-act="headhunt">Find a candidate · $300</button></div>`;
  }

function sumDays(list){return list.reduce((a,d)=>({rev:a.rev+d.rev,exp:a.exp+d.exp}),{rev:0,exp:0})}
function barChart(days){
  if(!days.length)return `<div class="empty">The chart fills in after your first day closes at midnight.</div>`;
  const W=640,H=210,pl=48,pb=24,pt=10,max=Math.max(1,...days.map(d=>Math.max(d.rev,d.exp)));
  const nice=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/nice)*nice;
  const bw=(W-pl-10)/days.length;const y=v=>H-pb-(v/top)*(H-pb-pt);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily revenue and expenses"><g class="grid">`;
  for(let i=0;i<=4;i++){const v=top*i/4;s+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?"$"+Math.round(v/1000)+"k":"$"+Math.round(v)}</text>`}
  s+="</g>";
  days.forEach((d,i)=>{const x=pl+i*bw+bw*.15,w=bw*.33;s+=`<rect x="${x}" y="${y(d.rev)}" width="${w}" height="${H-pb-y(d.rev)}" rx="2" fill="var(--brass)"><title>Day ${d.day} revenue ${money(d.rev)}</title></rect><rect x="${x+w+2}" y="${y(d.exp)}" width="${w}" height="${H-pb-y(d.exp)}" rx="2" fill="var(--idle)"><title>Day ${d.day} expenses ${money(d.exp)}</title></rect>`;
    if(days.length<=16||i%2===0)s+=`<text x="${x+w}" y="${H-6}" text-anchor="middle">D${d.day}</text>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--brass)"></i>Revenue</span><span><i style="background:var(--idle)"></i>Expenses</span></div>`;
}

function lineChart(vals,labels,fmt,maxV){
  if(vals.length<2)return `<div class="empty">Needs at least two closed days.</div>`;
  const W=640,H=180,pl=44,pb=22,pt=10;const max=maxV||Math.max(1,...vals);const y=v=>H-pb-(v/max)*(H-pb-pt);const x=i=>pl+i*(W-pl-14)/(vals.length-1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img"><g class="grid">`;for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}s+="</g>";
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(vals.length-1)},${y(0)}" fill="var(--brass-soft)"/><polyline points="${pts}" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="4" fill="var(--brass)"/>`;
  vals.forEach((v,i)=>{if(vals.length<=14||i%Math.ceil(vals.length/14)===0)s+=`<text x="${x(i)}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`});
  return s+"</svg>";
}

  <label class="f">Hotel name<input type="text" id="s-name" maxlength="40" placeholder="The Grand Meridian" value="The Grand Meridian"></label>
  <div><div class="small muted" style="font-weight:500;margin-bottom:4px">Game mode</div><div class="seg"><button type="button" class="${sb?"on":""}" data-act="setupMode" data-v="sandbox"><b>Sandbox</b><span>Pick your budget, build anything, no objectives.</span></button><button type="button" class="${!sb?"on":""}" data-act="setupMode" data-v="career"><b>Career</b><span>Objectives, rewards and unlocks. Floors are never level-locked.</span></button></div></div>
  <div class="grid g2"><label class="f">Starting budget<select id="s-budget">${(sb?[[50000,"$50,000 · Tight"],[100000,"$100,000 · Standard"],[250000,"$250,000 · Comfortable"],[1000000,"$1,000,000 · Tycoon"]]:[[100000,"$100,000 · Career standard"],[60000,"$60,000 · Hard"]]).map(([v,l],i)=>`<option value="${v}" ${i===(sb?1:0)?"selected":""}>${l}</option>`).join("")}</select></label>
  <label class="f">Starting rating<select id="s-rating">${[[2,"2★ · Unknown"],[3,"3★ · Respectable"],[4,"4★ · Well regarded"],[5,"5★ · Celebrated"]].map(([v,l])=>`<option value="${v}" ${v===3?"selected":""}>${l}</option>`).join("")}</select></label></div>
  <p class="small muted" style="margin:0">You start with two floors, three guest rooms, a reception, a restaurant and nine staff.</p>
  <button class="btn pri" type="submit" style="padding:10px">Open the hotel</button></form></div>`;
}

/* ============================ LOOP ============================ */
let loopId=null,acc=0,awayPaused=false,locked=false,lastLocal=0;
function startLoop(){
  if(loopId)return;
  loopId=setInterval(()=>{
    if(!G||locked)return;
    awayPaused=document.hidden;
    if(awayPaused||G.clock.speed===0)return;
    acc+=G.clock.speed*0.25;let steps=0;
    while(acc>=1){stepMinute();acc--;steps++}
    if(steps){
      renderTop();renderNav();
      const ae=document.activeElement;
      if(!modalFn&&!(ae&&ae.tagName==="SELECT")&&!(ae&&ae.type==="number"))renderMain();
      if(U.notesOpen)renderNotes();
    }
    const now=Date.now();
    if(now-lastLocal>5000){lastLocal=now;saveLocal()}
    if(dbDoc&&now-lastCloud>20000){lastCloud=now;saveCloud()}
  },250);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G)saveNow();if(G)renderTop()});
window.addEventListener("pagehide",()=>{if(G)saveLocal()});

/* single active tab */
const TAB_ID=Math.random().toString(36).slice(2);let bc=null;
try{bc=new BroadcastChannel("hotel-empire");bc.onmessage=ev=>{const m=ev.data||{};
  if(m.t==="hello"&&G&&!locked)bc.postMessage({t:"active",id:TAB_ID});
  if(m.t==="active"&&m.id!==TAB_ID&&!G)showBlocker("Hotel Authority is already running in another tab.");
  if(m.t==="takeover"&&m.id!==TAB_ID&&G){saveNow();locked=true;showBlocker("You opened Hotel Authority in another tab. The game is running there now.")}
}}catch(e){}
function showBlocker(msg){locked=true;$("#blocker").innerHTML=`<div class="blocker"><div><h1 style="color:#fff">Paused here</h1><p style="color:var(--ink-text);max-width:420px">${esc(msg)} Only one tab runs the simulation at a time, so the hotel never advances twice.</p><button class="btn pri" data-act="takeover">Run the game in this tab</button></div></div>`}
A.takeover=async()=>{try{bc&&bc.postMessage({t:"takeover",id:TAB_ID})}catch(e){}$("#blocker").innerHTML="";locked=false;await new Promise(r=>setTimeout(r,400));
  const local=loadLocal();if(local)G=local;if(G){renderAll(true);startLoop()}else boot()};

/* ============================ BOOT ============================ */
async function boot(){
  try{bc&&bc.postMessage({t:"hello",id:TAB_ID})}catch(e){}
  await new Promise(r=>setTimeout(r,300));if(locked)return;
  const local=loadLocal();
  const cloud=await Promise.race([connectCloud(),new Promise(r=>setTimeout(()=>r(null),4000))]);
  if(locked)return;
  let s=null;if(cloud&&local)s=(cloud.savedAt||0)>=(local.savedAt||0)?cloud:local;else s=cloud||local;
  if(s&&s.clock&&s.rooms){G=s;$("#root").innerHTML="";route();startLoop();toast(`Welcome back to ${G.name}. Resuming at ${clockStr(G.clock.m)}.`,"good")}
  else showSetup();
  if(!dbDoc)connectCloud().then(c=>{if(dbDoc&&G)saveCloud()});
}
boot();
</script>
